server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — Expo Router handles all client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets indefinitely
    location ~* \.(js|css|png|jpg|jpeg|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the entry point
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
