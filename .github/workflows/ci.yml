name: CI / CD

on:
  pull_request:
  push:
    branches: [develop, release]
    tags: ["v*"]

jobs:
  # ── Typecheck & extract version ───────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Extract version from package.json
        id: version
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          echo "app_version=${APP_VERSION}" >> $GITHUB_OUTPUT

      - run: npx tsc --noEmit

  # ── Lint ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci
      - run: npm run lint

  # ── Unit & component tests ────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci
      - run: npm test

  # ── Build web assets (native runner — no QEMU) ───────────────────────────
  build-web:
    name: Build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Export web bundle
        run: npx expo export --platform web
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"

      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist/
          retention-days: 1

  # ── Build & push Docker image (web / nginx) to GHCR ─────────────────────
  docker:
    name: Build & push image
    needs: [typecheck, lint, test, build-web]
    if: >
      github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/release'
      || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: dist/

      - name: Compute image tag
        id: tag
        run: |
          VERSION="${{ needs.typecheck.outputs.app_version }}"
          if [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "image_tag=${VERSION}-dev" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/release" ]]; then
            echo "image_tag=${VERSION}-rc.${{ github.run_number }}" >> $GITHUB_OUTPUT
          else
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "${TAG_VERSION}" != "${VERSION}" ]; then
              echo "Tag (${TAG_VERSION}) does not match package.json version (${VERSION})" >&2
              exit 1
            fi
            echo "image_tag=${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ci
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/web:${{ steps.tag.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

